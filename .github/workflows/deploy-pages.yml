name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "holon-research-site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: holon-research-site/holon_website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: holon-research-site/holon_website

      - name: Build redesigned site
        run: npm run build
        working-directory: holon-research-site/holon_website

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: holon-research-site/holon_website/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
